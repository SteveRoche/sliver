[workspace]
resolver = "3"
members = ["src-tauri", "crates/sliver-typst", "crates/sliver-vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Profiles only take effect at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
# Unwinding (not `panic = "abort"`): a panic inside Typst must not take the app
# down; the compiler host catches it and restarts the engine.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# A debug build of Typst is too slow to preview with, so `tauri dev` optimizes
# every dependency and the engine crate; the rest stays a fast debug build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.sliver-typst]
opt-level = 3
