[workspace]
resolver = "3"
members = ["src-tauri", "crates/sliver-typst", "crates/sliver-vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Profiles only take effect at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Fast-to-build optimized profile for the preview WASM; a debug build of typst is too slow to use.
[profile.wasm]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
