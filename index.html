<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Sliver</title>
    <script>
      // Before the first paint: the theme the backend read from the last
      // vault (src-tauri/src/window.rs), so startup doesn't flash.
      (() => {
        const choice = window.__SLIVER_THEME__ ?? 'system';
        const dark =
          choice === 'dark' ||
          (choice === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* Until App.css loads (in dev, through the scripts); its --bg. */
      html {
        background: #f6f6f6;
      }
      html[data-theme="dark"] {
        background: #2b2b2b;
        color-scheme: dark;
      }
      /* Shown until the last vault has opened (removed in App.tsx); after a
         moment, so a quick start doesn't blink. */
      #startup {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a8a8a;
        opacity: 0;
        animation: startup-show 0s 150ms forwards;
      }
      #startup svg {
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-show {
        to {
          opacity: 1;
        }
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="startup" role="status" aria-label="Loading">
      <!-- Lucide loader-circle -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
    </div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
