[package]
name = "sliver"
description = "Sliver - a Typst notetaking app"
authors = ["Steve Roche"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sliver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sliver-vault = { path = "../crates/sliver-vault" }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-window-state = "2.5.0"
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
tauri-plugin-opener = "2.7.2"
notify-debouncer-full = "0.7.0"
